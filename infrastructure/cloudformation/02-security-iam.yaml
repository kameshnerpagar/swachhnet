AWSTemplateFormatVersion: '2010-09-09'
Description: >-
  SwachhNet Cloud Architecture - 02 Security Groups and IAM Role
  Creates application security groups following least-privilege principles
  and a dedicated IAM instance profile for EC2.

Parameters:
  EnvironmentName:
    Type: String
    Default: swachhnet
    Description: Prefix used to name security and IAM resources

  VpcId:
    Type: AWS::EC2::VPC::Id
    Description: VPC ID where security groups will be created

Resources:
  # ── Application Security Group (EC2) ─────────────────────────────────────────
  AppSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Allow inbound HTTP/HTTPS traffic to SwachhNet web application
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 0.0.0.0/0
          Description: Allow public web HTTP traffic
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: 0.0.0.0/0
          Description: Allow public web HTTPS traffic
      SecurityGroupEgress:
        - IpProtocol: -1
          CidrIp: 0.0.0.0/0
          Description: Allow outbound traffic for AWS APIs, AI services, and OS updates
      Tags:
        - Key: Name
          Value: !Sub '${EnvironmentName}-app-sg'

  # ── Database Security Group (RDS PostgreSQL) ─────────────────────────────────
  DatabaseSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Allow PostgreSQL traffic strictly from Application Security Group
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 5432
          ToPort: 5432
          SourceSecurityGroupId: !Ref AppSecurityGroup
          Description: Allow database connections ONLY from EC2 App Security Group
      SecurityGroupEgress:
        - IpProtocol: -1
          CidrIp: 0.0.0.0/0
          Description: Allow outbound responses
      Tags:
        - Key: Name
          Value: !Sub '${EnvironmentName}-db-sg'

  # ── EC2 IAM Role & Instance Profile ──────────────────────────────────────────
  EC2InstanceRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${EnvironmentName}-ec2-instance-role'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ec2.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        # Enables AWS Systems Manager Session Manager (secure terminal without opening SSH port 22)
        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore
      Policies:
        - PolicyName: SwachhNetApplicationPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              # S3 Evidence Bucket Access
              - Effect: Allow
                Action:
                  - s3:PutObject
                  - s3:GetObject
                  - s3:DeleteObject
                  - s3:ListBucket
                Resource:
                  - !Sub 'arn:aws:s3:::${EnvironmentName}-evidence-*'
                  - !Sub 'arn:aws:s3:::${EnvironmentName}-evidence-*/*'
              # Systems Manager Parameter Store Access
              - Effect: Allow
                Action:
                  - ssm:GetParametersByPath
                  - ssm:GetParameter
                  - ssm:GetParameters
                Resource:
                  - !Sub 'arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/${EnvironmentName}/*'
              # SQS Job Queue Access
              - Effect: Allow
                Action:
                  - sqs:SendMessage
                  - sqs:ReceiveMessage
                  - sqs:DeleteMessage
                  - sqs:GetQueueAttributes
                Resource:
                  - !Sub 'arn:aws:sqs:${AWS::Region}:${AWS::AccountId}:${EnvironmentName}-*'
              # CloudWatch Logs Delivery
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                  - logs:DescribeLogStreams
                Resource:
                  - !Sub 'arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/${EnvironmentName}/*'

  EC2InstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      InstanceProfileName: !Sub '${EnvironmentName}-ec2-instance-profile'
      Roles:
        - !Ref EC2InstanceRole

Outputs:
  AppSecurityGroupId:
    Description: Security Group ID for EC2 Application
    Value: !Ref AppSecurityGroup
    Export:
      Name: !Sub '${EnvironmentName}-AppSecurityGroupId'

  DatabaseSecurityGroupId:
    Description: Security Group ID for RDS Database
    Value: !Ref DatabaseSecurityGroup
    Export:
      Name: !Sub '${EnvironmentName}-DatabaseSecurityGroupId'

  EC2InstanceProfileArn:
    Description: ARN of EC2 Instance Profile
    Value: !GetAtt EC2InstanceProfile.Arn
    Export:
      Name: !Sub '${EnvironmentName}-EC2InstanceProfileArn'

  EC2InstanceProfileName:
    Description: Name of EC2 Instance Profile
    Value: !Ref EC2InstanceProfile
    Export:
      Name: !Sub '${EnvironmentName}-EC2InstanceProfileName'

